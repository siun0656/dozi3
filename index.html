<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>5단원 4차시. 직육면체의 성질을 알아볼까요 — EPISODE 03 로봇 팔 대작전</title>
<!-- 글꼴: 인터넷이 없으면 기기 기본 한글 글꼴(맑은 고딕 등)로 자동 대체됩니다 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* ==========================================================
   EPISODE 01 · 멈춰 버린 분류 로봇 — 스타일
   캐릭터 그림체(수채화 + 갈색 잉크 낙서선 + 크림색 종이)에 맞춘 디자인
   ========================================================== */
:root{
  --paper:#F6EEDC; --paper2:#EFE3C8; --card:#FFFBF1; --card2:#FBF3E2;
  --ink:#3B2A1E; --ink2:#6B5640; --muted:#9A8569; --line:#D9C9A8;
  --amber:#E9A55C; --mint:#6FBFAE; --coral:#E2775F; --yellow:#F1C85B; --blue:#8DB7DA; --lav:#B6A3DB;
  --cube:#6FBFAE; --cuboid:#E9A55C; --none:#E2775F;
  --doji:#B97A4B; --baba:#D9783A; --kuni:#8C93A3; --bot:#6E9FC4;
  --hand:22px 16px 24px 18px / 18px 24px 16px 22px;
  --hand2:14px 18px 12px 20px / 20px 12px 18px 14px;
  --drop:4px 5px 0 rgba(59,42,30,.16);
  --f:"Gowun Dodum","Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --h:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans CJK KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--f);user-select:none;-webkit-user-select:none}
button{font-family:var(--h);cursor:pointer;border:0}
b,strong{font-weight:800}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center}
.screen{position:absolute;inset:0;display:none;flex-direction:column;animation:fadeIn .45s ease}
.screen.on{display:flex}
@keyframes fadeIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6) rotate(-3deg);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-1.5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes wiggle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}

/* ---------- 공통: 손그림 카드 ---------- */
.paper{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--hand);box-shadow:var(--drop)}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 28px;border-radius:var(--hand2);font-size:clamp(17px,1.8vw,22px);
  background:var(--amber);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;
  background-image:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.45),rgba(255,255,255,0) 60%)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background-color:var(--card);}
.btn.mint{background-color:var(--mint)}
.btn[disabled]{filter:grayscale(.7);opacity:.6;pointer-events:none}
.icon-btn{width:50px;height:50px;border-radius:var(--hand2);background:var(--card);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:24px;height:24px}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* ---------- 타이틀 ---------- */
#title{align-items:center;justify-content:center;text-align:center;padding:4vh 4vw}
.title-board{background:rgba(255,251,241,.9);border:3px solid var(--ink);border-radius:30px 24px 34px 22px / 24px 34px 22px 30px;box-shadow:6px 8px 0 rgba(59,42,30,.18);padding:3vh 5vw 3.4vh;max-width:980px}
.ep-tag{display:inline-flex;gap:10px;align-items:center;padding:7px 18px;border-radius:var(--hand2);background:var(--yellow);color:var(--ink);font-family:var(--h);letter-spacing:.08em;font-size:clamp(13px,1.4vw,16px);border:2px solid var(--ink)}
.title-main{font-family:var(--h);font-size:clamp(44px,7vw,92px);line-height:1.02;margin:16px 0 6px;letter-spacing:-.01em;color:var(--ink)}
.title-main .hl{color:#C9662E;position:relative;display:inline-block}
.title-main .hl::after{content:"";position:absolute;left:-4%;right:-4%;bottom:6%;height:28%;background:rgba(241,200,91,.55);border-radius:40% 60% 50% 50%;z-index:-1;transform:rotate(-1deg)}
.title-sub{font-size:clamp(15px,1.8vw,21px);color:var(--ink2);margin-bottom:1vh}
.title-cast{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,30px);height:clamp(140px,28vh,280px);margin:1vh 0 2.5vh}
.title-cast img{height:100%;object-fit:contain}
.title-cast img:nth-child(1){animation:bob 3s ease-in-out infinite}
.title-cast img:nth-child(2){animation:bob 3s ease-in-out .4s infinite}
.title-cast img:nth-child(3){animation:bob 2.4s ease-in-out .8s infinite}
.title-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.title-foot{position:absolute;bottom:2.2vh;left:0;right:0;text-align:center;color:var(--ink2);font-size:14px}
.corner{position:absolute;top:18px;right:18px;display:flex;gap:10px;z-index:5}

/* ---------- 상단 바 ---------- */
.topbar{display:flex;align-items:center;gap:14px;margin:12px 18px 0;padding:10px 14px;background:rgba(255,251,241,.94);border:2.5px solid var(--ink);border-radius:var(--hand);box-shadow:var(--drop);position:relative;z-index:4}
.stage-badge{padding:7px 14px;border-radius:var(--hand2);background:var(--amber);color:var(--ink);font-family:var(--h);font-size:16px;white-space:nowrap;border:2px solid var(--ink)}
.mission-title{font-family:var(--h);font-size:clamp(18px,1.9vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mission-goal{color:var(--ink2);font-size:clamp(13px,1.35vw,16px);margin-top:1px}
.mission-goal b{color:#B4541A}
.top-mid{flex:1;min-width:0}
.concept-tag{font-size:13px;color:var(--ink);background:#E7DDF6;padding:5px 11px;border-radius:var(--hand2);white-space:nowrap;border:1.8px solid var(--ink);font-family:var(--h)}
.repair{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-family:var(--h)}
.repair .bar{width:110px;height:14px;border-radius:10px;background:var(--paper2);overflow:hidden;border:2px solid var(--ink)}
.repair .bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#7FC6B6 0 8px,#6FBFAE 8px 16px);width:0;transition:width .8s}

/* ---------- 지도 ---------- */
#map{padding:0}
.map-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:2vh 4vw;overflow:auto}
.map-head{text-align:center;margin-bottom:2.4vh}
.map-head h2{margin:0;font-family:var(--h);font-size:clamp(28px,3.4vw,44px);font-weight:400}
.map-head p{margin:6px 0 0;color:var(--ink2)}
.map-nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2.2vw,30px);width:min(1100px,92vw);position:relative}
.node{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--hand);box-shadow:var(--drop);padding:18px 18px 16px;text-align:left;color:var(--ink);transition:transform .15s;font-family:var(--f)}
.node:nth-child(1){transform:rotate(-.8deg)} .node:nth-child(2){transform:rotate(.6deg)} .node:nth-child(3){transform:rotate(-.4deg)}
.node:not(.locked):hover{transform:translateY(-4px) rotate(0)}
.node:not(.locked):active{transform:scale(.98)}
.node .num{font-family:var(--h);font-size:14px;letter-spacing:.12em;color:#B4541A}
.node h3{margin:4px 0 4px;font-family:var(--h);font-weight:400;font-size:clamp(21px,2.2vw,27px)}
.node p{margin:0 0 10px;color:var(--ink2);font-size:14.5px;line-height:1.5;min-height:3em}
.node .thumb{height:clamp(90px,16vh,150px);border-radius:var(--hand2);background:radial-gradient(90% 80% at 50% 40%,#FFF7E6,#F1E4C6);margin-bottom:12px;position:relative;overflow:hidden;border:2px dashed #CBB48C}
.node .thumb canvas{width:100%;height:100%;display:block}
.node .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2)}
.node .stars{display:flex;gap:3px}
.node .stars svg{width:22px;height:22px}
.node.locked{filter:grayscale(.75) brightness(.96);pointer-events:none}
.node.locked::after{content:"잠김 · 앞 스테이지를 먼저 해결하세요";position:absolute;inset:auto 0 46% 0;text-align:center;font-family:var(--h);color:var(--ink);font-size:15px;background:rgba(255,251,241,.85);padding:6px}
.node.done{background:#F1FAF6}
.node .go{position:absolute;top:14px;right:14px;font-family:var(--h);font-size:14px;padding:4px 12px;border-radius:var(--hand2);background:var(--amber);color:var(--ink);border:2px solid var(--ink)}
.node.done .go{background:var(--mint)}

/* ---------- 플레이 ---------- */
#play .stagearea{flex:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:16px;padding:14px 18px 18px;min-height:0}
.viewer{position:relative;border-radius:var(--hand);background:radial-gradient(80% 70% at 50% 38%,#FFFDF6 0%,#F7EEDA 70%,#EFE2C4 100%);border:2.5px solid var(--ink);box-shadow:var(--drop);overflow:hidden;min-height:0}
.viewer .grid-floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,rgba(107,86,64,.08) 0 1.5px,transparent 1.5px 48px);border-top:2px dashed rgba(107,86,64,.25);pointer-events:none}
.viewer canvas.main3d{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.viewer canvas.main3d:active{cursor:grabbing}
.viewer .vhud{position:absolute;left:14px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:var(--hand2);background:var(--card);font-size:14px;font-family:var(--h);color:var(--ink);border:2px solid var(--ink)}
.chip b{color:#B4541A;font-weight:400}
.rot-pad{position:absolute;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
.rot-pad button{border-radius:12px;background:var(--card);color:var(--ink);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);display:flex;align-items:center;justify-content:center}
.rot-pad button svg{width:20px;height:20px}
.rot-pad button:active{background:var(--yellow);transform:translateY(2px);box-shadow:none}
.rot-pad .c{grid-column:2;grid-row:2;font-size:13px}
.mode-tabs{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;background:var(--card);padding:5px;border-radius:var(--hand2);border:2px solid var(--ink);pointer-events:none}
.mode-tabs span{padding:6px 12px;border-radius:10px;font-family:var(--h);font-size:15px;color:var(--muted)}
.mode-tabs span.on{color:var(--ink);border:2px solid var(--ink)}
.counter-big{position:absolute;right:16px;top:10px;text-align:right;pointer-events:none}
.counter-big .n{font-family:var(--h);font-size:clamp(40px,4.4vw,58px);line-height:1;color:var(--ink)}
.counter-big .l{font-size:14px;color:var(--ink2);font-family:var(--h)}
.hand-hint{position:absolute;pointer-events:none;width:68px;height:68px;left:50%;top:56%;animation:swipe 2.2s ease-in-out infinite}
@keyframes swipe{0%{transform:translate(-60px,0)}50%{transform:translate(40px,0)}100%{transform:translate(-60px,0)}}

.panel{border-radius:var(--hand);background:rgba(255,251,241,.96);border:2.5px solid var(--ink);box-shadow:var(--drop);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.panel h4{margin:0;font-family:var(--h);font-weight:400;font-size:18px;color:var(--ink);display:flex;align-items:center;gap:8px}
.panel h4::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink)}
.scan-screen{border-radius:var(--hand2);background-color:#FFFDF6;background-image:linear-gradient(rgba(141,183,218,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(141,183,218,.22) 1px,transparent 1px);background-size:22px 22px;border:2.2px solid var(--ink);position:relative;height:clamp(150px,26vh,230px);overflow:hidden}
.scan-screen canvas{width:100%;height:100%;display:block}
.scan-screen .ss-title{position:absolute;left:12px;top:8px;font-family:var(--h);font-size:19px;z-index:2}
.scan-screen .ss-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;text-align:center;padding:20px;font-family:var(--h)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border-radius:var(--hand2);padding:8px 6px;background:var(--card2);border:2px dashed #C9B48F;font-family:var(--h);font-size:15px;text-align:center;min-height:54px;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:background .3s;color:var(--ink)}
.slot small{font-family:var(--f);color:var(--ink2);font-size:12px}
.slot.s-sq{background:#D6EFE9;border:2px solid var(--ink)}
.slot.s-re{background:#F8DDBB;border:2px solid var(--ink)}
.slot.s-ot{background:#F6CFC4;border:2px solid var(--ink)}
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gate{border-radius:var(--hand2);padding:10px 6px;text-align:center;font-family:var(--h);font-size:16px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2.5px dashed var(--ink);transition:transform .15s,background .15s;color:var(--ink)}
.gate small{font-family:var(--f);font-size:12.5px;line-height:1.35;color:var(--ink2)}
.gate.g-cube{background:#E1F3EE}
.gate.g-cuboid{background:#FBE8CF}
.gate.g-none{background:#FADBD3}
.gate.over{transform:scale(1.05) rotate(-1deg);border-style:solid}
.gate.no{animation:shake .4s}
.token{align-self:center;display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:var(--hand2);background:var(--yellow);color:var(--ink);font-family:var(--h);font-size:17px;border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink);touch-action:none;cursor:grab;animation:wiggle 1.4s ease-in-out infinite}
.token canvas{width:58px;height:58px}
.token.dragging{position:fixed;z-index:50;pointer-events:none;transform:scale(1.08) rotate(-4deg);animation:none}
.locked-note{font-size:14px;color:var(--ink2);text-align:center;padding:10px;border-radius:var(--hand2);border:2px dashed #C9B48F;font-family:var(--h)}

.reason-list{display:flex;flex-direction:column;gap:8px}
.reason{padding:12px 16px;border-radius:var(--hand2);background:var(--card);color:var(--ink);font-family:var(--f);font-weight:800;font-size:15.5px;text-align:left;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.reason:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.reason.ok{background:#D6EFE9}
.reason.no{background:#F6CFC4;animation:shake .4s}

/* 부품 표 */
.dial-table{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:center}
.dial-table .hd{font-size:15px;color:var(--ink2);font-family:var(--h);text-align:center}
.dial-table .rl{font-family:var(--h);font-size:16px}
.dial{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card2);border-radius:var(--hand2);padding:5px;border:2px solid var(--ink)}
.dial button{width:36px;height:36px;border-radius:10px;background:var(--card);color:var(--ink);font-size:20px;border:2px solid var(--ink)}
.dial span{min-width:34px;text-align:center;font-size:24px;font-family:var(--h)}
.dial.ok{background:#D6EFE9}
.dial.no{background:#F6CFC4;animation:shake .4s}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twin .mini{height:120px;border-radius:var(--hand2);background:radial-gradient(90% 80% at 50% 40%,#FFF7E6,#F1E4C6);position:relative;border:2px solid var(--ink);cursor:pointer}
.twin .mini canvas{width:100%;height:100%}
.twin .mini b{position:absolute;left:10px;top:6px;font-size:14px;font-family:var(--h);font-weight:400}

.sort-zone{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zone{min-height:120px;border-radius:var(--hand2);border:2.5px dashed var(--ink);padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card2)}
.zone .zt{font-family:var(--h);font-size:17px;text-align:center;margin-bottom:4px}
.zone.over{background:#FFF3C9}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:50px}
.scard{padding:9px 12px;border-radius:10px 14px 9px 13px;background:#FFFDF6;color:var(--ink);font-weight:800;font-size:14px;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);touch-action:none;cursor:grab;line-height:1.35}
.scard.dragging{position:fixed;z-index:60;pointer-events:none;transform:rotate(-3deg) scale(1.05)}
.scard.ok{background:#D6EFE9}
.scard.no{animation:shake .4s;background:#F6CFC4}

/* 3단계 */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.crate{position:relative;border-radius:var(--hand2);background:radial-gradient(90% 80% at 50% 40%,#FFF7E6,#F1E4C6);height:clamp(96px,15vh,140px);border:2px solid var(--ink);cursor:pointer;transition:transform .12s}
.crate canvas{width:100%;height:100%;display:block}
.crate .tag{position:absolute;left:8px;top:5px;font-family:var(--h);font-size:15px;background:var(--card);padding:1px 9px;border-radius:8px;border:1.8px solid var(--ink)}
.crate.sel{background:#FFF0C2;box-shadow:0 0 0 4px var(--yellow);transform:translateY(-3px) rotate(-1deg)}
.crate.sel::after{content:"선택";position:absolute;right:8px;top:5px;background:var(--amber);color:var(--ink);font-family:var(--h);font-size:13px;padding:1px 9px;border-radius:8px;border:1.8px solid var(--ink)}
.crate.viewing{outline:2.5px dashed var(--mint);outline-offset:3px}
.order-card{border-radius:var(--hand2);background:#FFFDF6;color:var(--ink);padding:14px 16px;border:2.5px solid var(--ink);box-shadow:var(--drop);position:relative;transform:rotate(-.6deg)}
.order-card b{color:#B4541A}
.order-card .stamp{position:absolute;right:12px;top:-14px;background:var(--coral);color:#fff;font-family:var(--h);font-size:14px;padding:3px 12px;border-radius:8px;transform:rotate(5deg);border:2px solid var(--ink)}
.report{display:flex;flex-direction:column;gap:10px}
.stmt{border-radius:var(--hand2);background:var(--card2);padding:12px 14px;border:2px solid var(--ink)}
.stmt .t{font-weight:800;font-size:15.5px;line-height:1.45;margin-bottom:8px}
.stmt .ox{display:flex;gap:8px}
.stmt .ox button{flex:1;padding:8px;border-radius:12px;font-size:20px;background:var(--card);color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.stmt .fix{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.stmt .fix button{text-align:left;padding:9px 12px;border-radius:10px;background:var(--card);color:var(--ink);font-family:var(--f);font-weight:800;font-size:14.5px;border:2px solid var(--ink)}
.stmt.done{background:#E1F3EE}
.stmt .res{font-size:14px;color:#2E6B5F;font-weight:800;margin-top:6px;line-height:1.45}

/* ---------- 대화 ---------- */
#dialog{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;padding:0 3vw 2.6vh;pointer-events:none}
#dialog.on{display:block}
#dialog .scrim{position:fixed;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(80,58,36,.35));pointer-events:auto}
.dlg{position:relative;max-width:1100px;margin:0 auto;display:flex;align-items:flex-end;gap:0;pointer-events:auto;cursor:pointer}
.dlg .portrait{width:clamp(130px,17vw,220px);height:clamp(130px,17vw,220px);flex:0 0 auto;margin-right:-22px;margin-bottom:-4px;position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center}
.dlg .portrait img{max-width:100%;max-height:100%;animation:pop .35s ease}
.dlg .portrait svg{width:85%;height:85%;animation:pop .35s ease}
.dlg .box{flex:1;background:#FFFDF6;color:var(--ink);border-radius:30px 24px 32px 22px / 24px 32px 22px 30px;padding:22px 30px 22px 44px;min-height:clamp(110px,16vh,150px);border:3px solid var(--ink);box-shadow:6px 8px 0 rgba(59,42,30,.2);position:relative}
.dlg .name{position:absolute;top:-19px;left:40px;padding:4px 18px;border-radius:var(--hand2);font-family:var(--h);color:var(--ink);font-size:18px;border:2.5px solid var(--ink)}
.dlg .text{font-size:clamp(18px,2.05vw,24px);font-weight:800;line-height:1.55;white-space:pre-line}
.dlg .text em{font-style:normal;color:#C0561C;background:linear-gradient(transparent 62%,rgba(241,200,91,.55) 62%)}
.dlg .text strong{color:#2E6B5F}
.dlg .next{position:absolute;right:20px;bottom:12px;font-size:14px;color:var(--muted);font-family:var(--h);animation:bob 1.2s infinite}
.dlg .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dlg .choices button{padding:11px 16px;border-radius:var(--hand2);background:var(--card2);color:var(--ink);font-size:17px;text-align:left;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}

/* ---------- 토스트 ---------- */
#toast{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 20px;border-radius:var(--hand2);font-weight:800;font-size:16.5px;border:2.5px solid var(--ink);box-shadow:var(--drop);animation:pop .3s ease;max-width:80vw;text-align:center;line-height:1.45;color:var(--ink)}
.toast.good{background:#D6EFE9}
.toast.bad{background:#FBE0D8}
.toast.info{background:#FFF6D6}
#fx{position:fixed;inset:0;pointer-events:none;z-index:45}

/* ---------- 결과·엔딩 ---------- */
.modal{position:fixed;inset:0;z-index:35;background:rgba(80,58,36,.35);display:none;align-items:center;justify-content:center;padding:4vh 4vw}
.modal.on{display:flex}
.modal .sheet{background:#FFFBF1;border-radius:34px 26px 36px 24px / 26px 36px 24px 34px;padding:26px 32px;max-width:860px;width:100%;border:3px solid var(--ink);box-shadow:8px 10px 0 rgba(59,42,30,.2);text-align:center;animation:pop .4s ease;max-height:92vh;overflow:auto;color:var(--ink)}
.sheet h2{margin:6px 0;font-family:var(--h);font-weight:400;font-size:clamp(28px,3.2vw,40px)}
.sheet p{color:var(--ink2);line-height:1.6}
.sheet .bigstars{display:flex;justify-content:center;gap:10px;margin:12px 0}
.sheet .bigstars svg{width:60px;height:60px}
.sheet .reward{display:inline-flex;align-items:center;gap:12px;padding:10px 18px;border-radius:var(--hand2);background:#E3EEF8;border:2px solid var(--ink);font-family:var(--h);font-size:17px;margin:6px 0 12px}
.sheet .cast{display:flex;justify-content:center;align-items:flex-end;gap:10px;height:150px;margin:8px 0}
.sheet .cast img{height:100%}
.sheet .cast img:nth-child(odd){animation:bob 1.4s infinite}
.sheet .cast img:nth-child(even){animation:bob 1.4s .3s infinite}
.learn-card{text-align:left;background:#FFFDF6;background-image:repeating-linear-gradient(transparent 0 31px,rgba(141,183,218,.35) 31px 32px);color:var(--ink);border-radius:var(--hand2);padding:16px 22px;margin:12px 0;border:2.5px solid var(--ink)}
.learn-card li{margin:4px 0;font-weight:800;line-height:1.6}
.learn-card b{color:#B4541A}
.next-card{text-align:left;background:#FFF3C9;border:2.5px dashed var(--ink);border-radius:var(--hand2);padding:14px 20px;margin:10px 0;transform:rotate(-.5deg)}
.next-card .k{font-family:var(--h);color:#B4541A;letter-spacing:.06em;font-size:15px}
.next-card .t{font-family:var(--h);font-size:22px;margin:4px 0}
.sheet .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}

@media (max-width:900px),(max-aspect-ratio:1/1){
  #play .stagearea{grid-template-columns:1fr;grid-template-rows:minmax(260px,1fr) auto}
  .concept-tag{display:none}
}
@media (max-height:640px){
  .title-cast{height:120px}
  .dlg .portrait{width:110px;height:110px}
}

/* ===== EPISODE 02 추가 ===== */
.viewer canvas.pad2d{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none;background:#FFFDF6;cursor:crosshair}
.viewer.padmode canvas.pad2d{display:block}
.viewer.padmode .rot-pad,.viewer.padmode .grid-floor{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{flex:1;min-width:92px;font-family:var(--h);font-size:17px;padding:10px 8px;border:2.5px solid var(--ink);border-radius:var(--hand2);background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--drop)}
.tool svg{width:58px;height:14px}
.tool.on{background:var(--yellow);transform:translateY(-2px)}
.tool.small{flex:0 0 auto;min-width:0;padding:8px 12px;font-size:15px}
.dcards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dcard{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:var(--hand2);padding:6px;cursor:pointer;box-shadow:var(--drop)}
.dcard canvas{width:100%;height:auto;display:block}
.dcard .lb{position:absolute;left:8px;top:4px;font-family:var(--h);font-size:20px}
.dcard.sel{background:#FFF3C9;outline:4px solid var(--amber)}
.dcard.ok{background:#E1F3EE;outline:4px solid var(--mint)}
.dcard.no{background:#FBE0D8;outline:4px solid var(--coral)}
.dcard .why{font-size:12.5px;line-height:1.35;color:var(--ink2);margin-top:2px;min-height:0}
.snaps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.snap{background:#fff;border:2.5px dashed var(--line);border-radius:var(--hand2);text-align:center;font-family:var(--h);font-size:15px;padding:4px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.snap.done{border-style:solid;border-color:var(--ink);background:#FFFBF1}
.snap canvas{width:100%;height:auto;border-radius:10px}
.snap.cur{outline:3px solid var(--amber)}
.snap.pick{cursor:pointer}
.snap.pick:hover{background:#FFF3C9}
.toggle-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;line-height:2}
.toggle-row button{font-family:var(--h);font-size:17px;padding:4px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer}
.toggle-row button.on{background:var(--yellow)}
.toggle-row button.ok{background:#BFE6DB}.toggle-row button.no{background:#F6C2B6}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.keypad button{font-family:var(--h);font-size:20px;padding:8px 0;border:2px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer}
.numshow{font-family:var(--h);font-size:34px;text-align:center;background:#fff;border:2.5px solid var(--ink);border-radius:var(--hand2);padding:4px 0;min-height:56px}
.dial-table6{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dial-table6 .grp{background:#fff;border:2px solid var(--ink);border-radius:var(--hand2);padding:6px 8px}
.dial-table6 .grp b{font-family:var(--h);font-size:16px;display:block;text-align:center;margin-bottom:4px}
.dial-table6 .row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:14px;margin:3px 0}
.dial-table6 .dial{display:flex;align-items:center;gap:4px}
.dial-table6 .dial button{width:32px;height:32px;border-radius:10px;border:2px solid var(--ink);background:var(--card);font-size:18px;cursor:pointer}
.dial-table6 .dial span{min-width:26px;text-align:center;font-family:var(--h);font-size:22px}
.dial-table6 .dial.ok span{color:#2E8A7C}.dial-table6 .dial.no span{color:#C9452F}
.legend{display:flex;gap:14px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:34px;height:0;border-top:4px solid var(--ink);vertical-align:middle;margin-right:4px}
.legend i.d{border-top-style:dashed}
/* ---------- EP03 ---------- */
.q3{font-size:16px;line-height:1.55;font-weight:800;color:#3B2A1E;margin-bottom:8px}
.q3 b{color:#B4541A}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbtn{position:relative;font-family:var(--h);font-size:17px;padding:10px 8px;min-height:46px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.fbtn.on{background:var(--yellow)}
.fbtn.ok{background:#BFE6DB}
.fbtn.no{background:#F6C2B6;animation:shake .4s}
.fbtn .bd{position:absolute;right:7px;top:3px;font-size:15px;color:#C0561C;letter-spacing:2px}
.pairlist{display:flex;flex-direction:column;gap:6px}
.pairlist .pr{display:flex;align-items:center;gap:8px;padding:7px 10px;border:2.5px solid;border-radius:12px;background:#fff;font-weight:800;font-size:14.5px}
.pairlist .pr i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}
.rounds{display:flex;gap:8px;margin:6px 0}
.rounds span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--h);border:2px solid var(--ink);background:#fff}
.rounds span.cur{background:var(--yellow)}
.rounds span.ok{background:#BFE6DB}
.rule3{margin-top:8px;padding:8px 10px;border-radius:12px;background:#FFF3C9;border:2px dashed var(--ink);font-size:14.5px;line-height:1.6;font-weight:800}
.pcard{padding:4px 6px}
.pcard canvas{display:block}
.zone .pcard{align-self:center}
#kp{grid-template-columns:repeat(4,1fr)}

</style>

<script>
/* ==========================================================
   BOX ENGINE — 의존성 없는 캔버스 3D 육면체 렌더러
   - 외부 라이브러리 없이 동작 (오프라인 교실에서도 안정적)
   - 회전(드래그/터치), 면·모서리·꼭짓점 선택, 강조 표시
   ========================================================== */
(function (global) {
  'use strict';

  // ---------- 벡터 유틸 ----------
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  // ---------- 면 모양 판별 ----------
  function classifyQuad(P) {
    const sides = [], angs = [];
    for (let i = 0; i < 4; i++) {
      const a = P[i], b = P[(i + 1) % 4], c = P[(i + 3) % 4];
      sides.push(len(sub(b, a)));
      const u = norm(sub(b, a)), v = norm(sub(c, a));
      angs.push(Math.acos(Math.max(-1, Math.min(1, dot(u, v)))) * 180 / Math.PI);
    }
    const right = angs.every(x => Math.abs(x - 90) < 1);
    const eqAll = sides.every(s => Math.abs(s - sides[0]) < 0.01);
    const par = (i, j) => {
      const d1 = norm(sub(P[(i + 1) % 4], P[i])), d2 = norm(sub(P[(j + 1) % 4], P[j]));
      return Math.abs(Math.abs(dot(d1, d2)) - 1) < 1e-4;
    };
    let shape;
    if (right && eqAll) shape = '정사각형';
    else if (right) shape = '직사각형';
    else if (par(0, 2) && par(1, 3)) shape = eqAll ? '마름모' : '평행사변형';
    else if (par(0, 2) || par(1, 3)) shape = '사다리꼴';
    else shape = '사각형';
    return { shape, sides, angs };
  }

  // ---------- 메시 생성 ----------
  // 8개 꼭짓점: 0~3 아래(앞왼,앞오,뒤오,뒤왼), 4~7 위(같은 순서)
  const QUADS = [
    [0, 1, 2, 3], // 아래
    [4, 5, 6, 7], // 위
    [0, 1, 5, 4], // 앞
    [3, 2, 6, 7], // 뒤
    [0, 3, 7, 4], // 왼
    [1, 2, 6, 5]  // 오
  ];
  const FACE_NAMES = ['아랫면', '윗면', '앞면', '뒷면', '왼쪽 면', '오른쪽 면'];

  function makeHexa(V, opts) {
    opts = opts || {};
    const c = mul(V.reduce((s, v) => add(s, v), [0, 0, 0]), 1 / V.length);
    V = V.map(v => sub(v, c));
    const F = QUADS.map((q, i) => {
      let idx = q.slice();
      const P = idx.map(k => V[k]);
      let n = norm(cross(sub(P[1], P[0]), sub(P[3], P[0])));
      const fc = mul(P.reduce((s, v) => add(s, v), [0, 0, 0]), 0.25);
      if (dot(n, fc) < 0) { idx = [idx[0], idx[3], idx[2], idx[1]]; n = mul(n, -1); }
      const info = classifyQuad(idx.map(k => V[k]));
      return { v: idx, n, c: fc, name: FACE_NAMES[i], shape: info.shape, sides: info.sides, role: ['bottom', 'top', 'front', 'back', 'left', 'right'][i] };
    });
    const E = [], ek = {};
    F.forEach((f, fi) => {
      for (let i = 0; i < 4; i++) {
        const a = f.v[i], b = f.v[(i + 1) % 4];
        const k = a < b ? a + '-' + b : b + '-' + a;
        if (!ek[k]) { ek[k] = { a: Math.min(a, b), b: Math.max(a, b), faces: [] }; E.push(ek[k]); }
        ek[k].faces.push(fi);
      }
    });
    E.forEach(e => { e.len = len(sub(V[e.a], V[e.b])); });
    const vFaces = V.map((_, vi) => F.map((f, fi) => f.v.includes(vi) ? fi : -1).filter(x => x >= 0));
    const R = Math.max(...V.map(len));
    const shapes = F.map(f => f.shape);
    let kind = 'none';
    if (shapes.every(s => s === '정사각형')) kind = 'cube';
    else if (shapes.every(s => s === '직사각형' || s === '정사각형')) kind = 'cuboid';
    return Object.assign({ V, F, E, vFaces, R, kind }, opts);
  }

  const Geo = {
    // 직육면체/정육면체: 가로 w, 높이 h, 세로(깊이) d  (단위 cm)
    box(w, h, d, o) {
      const x = w / 2, y = h / 2, z = d / 2;
      return makeHexa([[-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], [-x, y, -z], [x, y, -z], [x, y, z], [-x, y, z]], Object.assign({ dims: [w, h, d] }, o));
    },
    // 사각뿔대(윗면이 작은 상자): 옆면이 사다리꼴
    frustum(wb, db, wt, dt, h, o) {
      const y = h / 2;
      return makeHexa([[-wb / 2, -y, -db / 2], [wb / 2, -y, -db / 2], [wb / 2, -y, db / 2], [-wb / 2, -y, db / 2],
        [-wt / 2, y, -dt / 2], [wt / 2, y, -dt / 2], [wt / 2, y, dt / 2], [-wt / 2, y, dt / 2]], o);
    },
    // 비스듬한 상자: 윗면이 옆으로 s만큼 밀림 → 앞·뒷면이 평행사변형
    slant(w, h, d, s, o) {
      const x = w / 2, y = h / 2, z = d / 2;
      return makeHexa([[-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], [-x + s, y, -z], [x + s, y, -z], [x + s, y, z], [-x + s, y, z]], o);
    },
    // 비스듬한 상자(깊이 방향): 옆면(왼/오)이 평행사변형 → 정면에서는 직사각형처럼 보임
    slantZ(w, h, d, s, o) {
      const x = w / 2, y = h / 2, z = d / 2;
      return makeHexa([[-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], [-x, y, -z + s], [x, y, -z + s], [x, y, z + s], [-x, y, z + s]], o);
    }
  };

  // ---------- 색 유틸 ----------
  function hexToRgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
  function shade(hex, k) { const c = hexToRgb(hex); return 'rgb(' + c.map(v => Math.max(0, Math.min(255, Math.round(v * k)))).join(',') + ')'; }

  // ---------- 뷰 ----------
  class BoxView {
    constructor(canvas, opts) {
      this.cv = canvas; this.ctx = canvas.getContext('2d');
      this.o = Object.assign({
        yaw: -0.62, pitch: 0.42, color: '#D8A66A', style: 'cardboard', edgeColor: '#3B2A1E', edgeWidth: 2.8,
        interactive: true, autoSpin: 0, showLabels: false, ground: true, bg: null, fit: 0.78, lengthTags: false
      }, opts || {});
      this.yaw = this.o.yaw; this.pitch = this.o.pitch; this.vy = 0; this.vp = 0;
      this.mark = { faces: {}, edges: {}, verts: {} }; // index -> color
      this.flash = null; this.mesh = null; this.onTap = null; this.onRotate = null;
      this.pulse = 0; this.ghost = null; this.dragging = false; this.userTouched = false;
      this.dpr = Math.min(2, global.devicePixelRatio || 1);
      if (this.o.interactive) this._bind();
      this._resize();
      this._ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => this._resize()) : null;
      if (this._ro) this._ro.observe(canvas);
    }
    setMesh(m, keepAngle) {
      this.mesh = m; this.mark = { faces: {}, edges: {}, verts: {} }; this.flash = null;
      if (!keepAngle) { this.yaw = this.o.yaw; this.pitch = this.o.pitch; }
      this.userTouched = false; this.draw();
    }
    _resize() {
      const r = this.cv.getBoundingClientRect();
      if (!r.width) return;
      this.W = r.width; this.H = r.height;
      this.cv.width = Math.round(r.width * this.dpr); this.cv.height = Math.round(r.height * this.dpr);
      this.draw();
    }
    _bind() {
      const cv = this.cv; let sx, sy, lx, ly, lt, moved = false, pid = null;
      cv.style.touchAction = 'none';
      cv.addEventListener('pointerdown', e => {
        pid = e.pointerId; cv.setPointerCapture(pid); sx = lx = e.clientX; sy = ly = e.clientY; lt = performance.now();
        moved = false; this.dragging = true; this.vy = this.vp = 0; this.userTouched = true;
      });
      cv.addEventListener('pointermove', e => {
        if (!this.dragging || e.pointerId !== pid) return;
        const dx = e.clientX - lx, dy = e.clientY - ly;
        if (Math.hypot(e.clientX - sx, e.clientY - sy) > 7) moved = true;
        if (moved) {
          this.yaw += dx * 0.011; this.pitch = Math.max(-1.15, Math.min(1.15, this.pitch + dy * 0.011));
          const now = performance.now(), dt = Math.max(8, now - lt);
          this.vy = dx * 0.011 / dt * 16; this.vp = dy * 0.011 / dt * 16; lt = now;
          if (this.onRotate) this.onRotate();
        }
        lx = e.clientX; ly = e.clientY;
      });
      const up = e => {
        if (!this.dragging) return; this.dragging = false;
        if (!moved && this.onTap) {
          const r = cv.getBoundingClientRect();
          this.onTap(e.clientX - r.left, e.clientY - r.top, e);
        }
      };
      cv.addEventListener('pointerup', up);

    const last = i === 2;
    M.innerHTML = `<div class="sheet"><div class="ep-tag">STAGE ${i + 1} CLEAR</div><h2>${STAGES[i].name} 성공!</h2>
      <div class="bigstars">${[1, 2, 3].map(k => STAR(stars >= k)).join('')}</div>
      <div class="reward"><span style="width:48px;height:48px;display:inline-block">${botSVG('ok')}</span>보상: ${chips[i]} 획득 · 작전 진행률 ${repairPct()}%</div>
      <p>${stars === 3 ? '평행과 수직을 완벽하게 찾아냈어요!' : '틀려도 다시 살펴보고 고친 것이 진짜 실력이에요!'} ${stars < 3 ? '(다시 도전하면 별을 더 모을 수 있어요)' : ''}</p>
      <div class="cast"><img src="${img('doji', 1)}" alt="도지"><img src="${img('baba', 8)}" alt="바바"><img src="${img('kuni', 2)}" alt="쿠니"></div>
      <div class="row">${last ? '<button class="btn" id="mNext">엔딩 보기</button>' : '<button class="btn" id="mNext">다음 스테이지</button>'}<button class="btn ghost" id="mMap">스테이지 지도</button></div></div>`;
    $('#mMap').onclick = () => { M.classList.remove('on'); goMap(); };
    $('#mNext').onclick = () => { M.classList.remove('on'); if (last) ending(); else startStage(i + 1); };
  }
  async function ending() {
    show('map'); buildMap(); padOn(null);
    await say([
      { who: 'bot', mood: 'ok', text: '모든 상자 적재 완료. 컨테이너 출발합니다. *로봇 팔 대작전 성공!*' },
      { who: 'kuni', pose: 8, text: '캬호오!!! 이번엔 한 번도 안 미끄러졌어! 집게는 *평행한 두 면*을 잡아야 했던 거야!' },
      { who: 'doji', pose: 7, text: '내... 내가 정리해 볼게! 계속 늘여도 만나지 않는 두 면은 서로 *평행*하고, 그 두 면이 *밑면*이야. 밑면과 만나는 면이 *옆면*이고, 밑면과 옆면은 *수직*으로 만나!' },
      { who: 'baba', pose: 8, text: '완벽해 바바! 평행한 면은 *3쌍*, 한 밑면에 대한 옆면은 *4개*까지 기억하면 최고야!' },
      { who: 'bot', mood: 'think', text: '삐빅—. *다음 임무 수신*. 다 쓴 정육면체 상자를 펼쳐서 납작하게 모아야 합니다.' },
      { who: 'bot', mood: 'think', text: '정육면체 모양의 상자를 *모서리를 잘라 펼치면* 어떤 모양이 될까요?' },
      { who: 'doji', pose: 6, text: '으에...? 상자를 펼치면 네모 6개가 어떻게 붙어 있을까...?' },
      { who: 'kuni', pose: 6, text: '머릿속으로 펼쳐 보면... 큐우우웅~ 십자 모양? 아니면 다른 모양도 될까?' },
      { who: 'baba', pose: 4, text: '그건 *다음 시간*에 함께 알아보자 바바! 선생님 화면에서 EPISODE 04가 기다리고 있어!' }
    ]);
    const M = $('#modal'); M.classList.add('on'); Sound.clear(); confetti(220);
    M.innerHTML = `<div class="sheet"><div class="ep-tag">EPISODE 03 COMPLETE</div><h2>로봇 팔 대작전 성공!</h2>
      <div class="cast"><img src="${img('doji', 8)}" alt="도지와 바바"><span style="width:130px;display:inline-block">${botSVG('ok')}</span><img src="${img('kuni', 8)}" alt="쿠니"></div>
      <div class="learn-card"><div style="font-family:var(--h);font-size:20px;margin-bottom:4px">오늘의 배움 카드 — 배움공책에 옮겨 적어요</div><ol>
      <li>직육면체에서 계속 늘여도 만나지 않는 두 면을 서로 <b>평행</b>하다고 합니다. 이 두 면을 직육면체의 <b>밑면</b>이라고 합니다.</li>
      <li>직육면체에는 서로 평행한 면이 <b>3쌍</b> 있고, 서로 평행한 면은 각각 밑면이 될 수 있어요.</li>
      <li>직육면체에서 밑면과 만나는 면을 직육면체의 <b>옆면</b>이라고 합니다. 이때 밑면과 옆면은 <b>수직</b>으로 만납니다.</li>
      <li>한 밑면에 대한 옆면은 모두 <b>4개</b>예요. (교과서 117쪽 3: 면 ㄱㄴㄷㄹ과 평행한 면은 면 ㅁㅂㅅㅇ, 수직인 면은 4개)</li></ol></div>
      <div class="next-card"><div class="k">NEXT · EPISODE 04 (다음 시간)</div><div class="t">정육면체 모양의 상자를 펼치면 어떤 모양이 될까?</div><div>정육면체의 모서리를 잘라서 펼친 모양을 알아봐요. 다음 시간 PPT에서 이어집니다.</div></div>
      <p>별 합계: ${SAVE.stars.reduce((a, b) => a + b, 0)} / 9</p>
      <div class="row"><button class="btn" id="eMap">스테이지 지도</button><button class="btn ghost" id="eRe">처음부터 다시 하기</button></div></div>`;
    $('#eMap').onclick = () => { M.classList.remove('on'); goMap(); };
    $('#eRe').onclick = () => { M.classList.remove('on'); resetAll(); };
  }
  function goMap() { clearMinis(); show('map'); buildMap(); }
  function resetAll() { const snd = SAVE.sound; Store.reset(); SAVE = freshSave(); SAVE.sound = snd; persist(); show('title'); }

  async function prologue() {
    show('map'); buildMap();
    await say([
      { who: 'bot', mood: 'error', text: '삐빅. 로봇 팔 시험 운전 1회차 실패. 집게가 *윗면과 옆면*을 잡아 상자가 미끄러졌습니다.' },
      { who: 'kuni', pose: 5, text: '큐우... 이번엔 수업에서 배운 대로 제대로 잡을 거야!' },
      { who: 'doji', pose: 2, text: '으에... 오늘 밤까지 상자를 다 실어야 한대...!' },
      { who: 'baba', pose: 3, text: '마주 보는 면은 *평행*, 만나는 면은 *수직*! 오늘 배운 걸 쓰면 다 해낼 수 있어 바바!' }
    ]);
    SAVE.introSeen = true; persist();
  }

  /* ---------------- 버튼 연결 ---------------- */
  $('#btnStart').onclick = async () => { Sound._c(); Sound.good(); if (!SAVE.introSeen) await prologue(); else goMap(); };
  $('#btnReset').onclick = () => { if ($('#btnReset').dataset.armed) { resetAll(); toast('진행 기록을 지웠어요. 처음부터 시작해요!', 'info'); $('#btnReset').textContent = '처음부터 다시 하기'; delete $('#btnReset').dataset.armed; } else { $('#btnReset').dataset.armed = 1; $('#btnReset').textContent = '한 번 더 누르면 기록이 지워져요'; } };
  $('#btnHint').onclick = () => {
    Sound.tap(); if (!P.task || !P.task.hint) return;
    P.hintLv = Math.min(3, P.hintLv + 1); P.hints++;
    say([{ who: ['baba', 'kuni', 'baba'][P.hints % 3], pose: [3, 6, 4][P.hints % 3], text: P.task.hint(P.hintLv) }]);
  };
  $('#btnMap').onclick = () => { Sound.tap(); goMap(); };
  $('#btnMapTitle').onclick = () => { Sound.tap(); show('title'); syncTitle(); };
  const sndBtns = document.querySelectorAll('.btnSound');
  const sndIcon = () => SAVE.sound ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  sndBtns.forEach(b => { b.innerHTML = sndIcon(); b.onclick = () => { SAVE.sound = !SAVE.sound; persist(); sndBtns.forEach(x => x.innerHTML = sndIcon()); }; });
  $('#btnFull').onclick = () => { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { } };

  function syncTitle() {
    $('#castRow').innerHTML = `<img src="${img('doji', 1)}" alt="도지"><img src="${img('baba', 1)}" alt="바바"><img src="${img('kuni', 3)}" alt="쿠니">`;
    $('#btnStart').innerHTML = SAVE.introSeen ? '이어서 하기' : '미션 시작';
  }
  syncTitle();

  /* ---------------- 메인 루프 ---------------- */
  let last = performance.now();
  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    drawBG(dt);
    if ($('#play').classList.contains('on')) { if (!PAD) view.tick(dt); else drawPad(dt); if (P.onTick) P.onTick(dt); }
    minis.forEach(v => v.tick(dt));
    fxTick();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 테스트·디버그용 접근(화면에는 노출되지 않음)
  window.__GAME = { P, STAGES, view, SAVE: () => SAVE, startStage, goMap, padOn, getPad: () => PAD, pad, runMission, ending };
})();

</script>
</body>
</html>
